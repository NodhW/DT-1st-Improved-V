[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/strava/start"
  to = "/.netlify/functions/strava?action=start"
  status = 200
  force = true

[[redirects]]
  from = "/api/strava/callback"
  to = "/.netlify/functions/strava?action=callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/strava/exchange"
  to = "/.netlify/functions/strava?action=exchange"
  status = 200
  force = true

[[redirects]]
  from = "/api/strava/sync"
  to = "/.netlify/functions/strava?action=sync"
  status = 200
  force = true

[[redirects]]
  from = "/api/calendar/sync"
  to = "/.netlify/functions/calendar"
  status = 200
  force = true
